services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - 8000:8000
    env_file:
      - .env
    # Lets the container reach a server on your machine by name, which is how
    # llm.base_url addresses Ollama, LM Studio or llama.cpp. Inside a container
    # `localhost` is the container itself, so without this a local model server
    # is unreachable no matter how the url is written.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - DATABASE_URL=postgresql://langgraph_user:langgraph_password@postgres:5432/langgraph_db?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./apps/api/src:/app/apps/api/src
      # config.yaml is read at import time, so a copy baked into the image goes
      # stale as soon as the file is edited and the container then fails to boot
      # against the code that is mounted live. Mounted read-only so an edit is
      # picked up without a rebuild and cannot be changed from inside.
      - ./config.yaml:/app/config.yaml:ro
  
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - 6333:6333
      - 6334:6334
    volumes:
      - ./qdrant_data:/qdrant/storage:z
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=langgraph_user
      - POSTGRES_PASSWORD=langgraph_password
      - POSTGRES_DB=langgraph_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langgraph_user -d langgraph_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    volumes:
      - ./postgres_data:/var/lib/postgresql/data