[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cohere>=7.0.5",
    "fastapi>=0.138.0",
    # Gets a structured response out of any OpenAI-compatible model, so the
    # intent router does not need a model that supports JSON schema natively.
    "instructor>=1.15.4",
    "langchain>=1.3.0",
    # langchain-core 1.6 broke create_agent's tool-calling branch (KeyError on the
    # "model" node). Hold below that until it is fixed upstream.
    "langchain-core>=1.4.8,<1.6",
    # The OpenAI compatible client. One client serves every provider that speaks
    # the protocol: OpenRouter, Groq, OpenAI, Together, DeepSeek, and so on.
    "langchain-openai>=1.3.3",
    "langgraph>=1.2.2",
    "langgraph-checkpoint-postgres>=3.0.0",
    "langsmith>=0.9.3",
    "openai>=2.43.0",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.18.0",
    "uvicorn>=0.49.0",
    # Imported directly, so declared rather than inherited. Both were only
    # present because another package happened to pull them in, and vanished
    # the moment that package was removed.
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.0",
    "starlette>=0.40.0",
]

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

[tool.uv.sources]
shared = {workspace = true }

