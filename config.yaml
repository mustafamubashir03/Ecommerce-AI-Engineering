# Every changeable value in the project lives here.
# Secrets stay in .env; this file only names the env var to read them from.

llm:
  # One OpenAI-compatible provider. These three lines are the whole provider
  # setup, so switching provider or model is a config edit, never a code edit.
  #
  #   OpenRouter   https://openrouter.ai/api/v1     OPENROUTER_API_KEY
  #   Groq         https://api.groq.com/openai/v1   GROQ_API_KEY
  #   OpenAI       https://api.openai.com/v1        OPENAI_API_KEY
  #   Together     https://api.together.xyz/v1     TOGETHER_API_KEY
  #   DeepSeek     https://api.deepseek.com/v1      DEEPSEEK_API_KEY
  #
  # Override any of them from .env to switch without touching this file.
  model: "${LLM_MODEL:-poolside/laguna-s-2.1:free}"
  base_url: "${LLM_BASE_URL:-https://openrouter.ai/api/v1}"
  api_key_env: "${LLM_API_KEY_ENV:-OPENROUTER_API_KEY}"

  temperature: 0
  # Free tiers reject very large max_tokens, so keep this bounded.
  max_tokens: 2048
  # Written in seconds. The OpenAI client takes seconds too, so no conversion.
  timeout_seconds: 120

retrieval:
  collection: Amazon-items-collection-01-hybrid
  top_k: 5
  max_top_k: 10
  fusion: rrf
  prefetch_limit: 20

  # Qdrant named vectors for the hybrid search.
  dense_vector: text-embedding-3-small
  sparse_vector: bm25
  sparse_model: qdrant/bm25

  # Payload fields read back for the product cards.
  fields:
    id: parent_asin
    image: image
    price: price
    rating: average_rating
    description: processed_description

embedding:
  api_key_env: COHERE_API_KEY
  model: embed-v4.0
  input_type: classification
  dimensions: 1536
  embedding_types: [float]

storage:
  qdrant_url_env: QDRANT_URL
  qdrant_url_default: http://localhost:6333
  database_url_env: DATABASE_URL

api:
  cors_origins:
    - http://localhost:5173
    - http://localhost:3000
    - http://127.0.0.1:5173
    - http://127.0.0.1:3000
  cors_allow_credentials: true

agent:
  max_iterations: 12

  prompts:
    intent_router: |
      You are part of a shopping assistant that can answer questions about products in stock.
      Instructions:
      - Classify the question as relevant or not relevant.
      - If it is not relevant, return False in "question_relevancy" and set "answer" to why.
      - If it is relevant, return True in "question_relevancy" and set "answer" to "".
      - You only answer questions about the products in stock.

    shopping_agent: |
      You are a shopping assistant that answers questions about the products that are currently in stock.
      Instructions:
      - Always call the `retrieve_data_tool` tool before answering anything about products, prices, ratings or availability.
      - You may call the tool several times, with a broader or a more specific wording, until the available products answer the question.
      - Answer only from what the tool returned, never from memory. If the products do not cover the question, say so.
      - Never use the word context, refer to it as the available products.
      - Quote the id of every product you use inline, like this: [B0ABC12345].
      - Give a detailed answer with the relevant specifications as bullet points.
